[project]
name = "promprint-data-wrangling"
dynamic = ["version"]
description = "General scripts for managing promprint data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.59",
    "pandas>=2.3.3",
    "pytest>=9.0.1",
    "regex>=2026.4.4",
]

[project.scripts]
pdw = "cli.main:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/datawrangling"]
