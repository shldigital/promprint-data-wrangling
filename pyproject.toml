[project]
name = "promprint-data-wrangling"
dynamic = ["version"]
description = "General scripts for managing promprint data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
    "pytest>=9.0.1",
]

[project.scripts]
pdw = "datawrangling.main:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/datawrangling"]